<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Chánh Điện Tịnh Tâm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS window capture. Everything sits on a 1080×1920 stage scaled to the window. */
:root{
  --bg:#0c0705; --fg:#f6e9cf; --muted:#c9ad84; --gold:#e2b04f; --gold2:#ffd98a; --red:#7e1d12;
  --panel:rgba(28,13,7,.78); --line:rgba(226,176,79,.55);
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
/* title plaque */
#plaque{left:90px;right:90px;top:70px;height:150px;border:3px solid var(--gold);border-radius:28px;
  background:linear-gradient(180deg,rgba(70,26,10,.92),rgba(30,12,6,.92));box-shadow:0 0 0 6px rgba(0,0,0,.35),0 0 50px rgba(226,176,79,.25) inset;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#plaque::before,#plaque::after{content:"❁";position:absolute;top:50%;transform:translateY(-50%);font-size:44px;color:var(--gold)}
#plaque::before{left:34px}#plaque::after{right:34px}
#title{font-family:var(--display);font-weight:700;font-size:58px;letter-spacing:.06em;color:var(--gold2);text-transform:uppercase;text-shadow:0 2px 0 #3a1406,0 0 20px rgba(255,200,100,.35)}
#subtitle{font-family:var(--display);font-size:30px;letter-spacing:.12em;color:var(--fg)}
/* pills */
#pills{top:244px;left:0;right:0;display:flex;justify-content:center;gap:26px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:12px 28px;font-size:34px;font-weight:600;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.pill small{font-size:20px;font-weight:500;color:var(--muted);line-height:1.05}
.dot{width:18px;height:18px;border-radius:50%;background:#46d36b;box-shadow:0 0 12px #46d36b}
/* side cards */
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 22px;font-size:25px;line-height:1.4;backdrop-filter:blur(4px)}
#guide{left:24px;top:630px;width:290px}
#guide div+div{border-top:1px solid rgba(226,176,79,.3);margin-top:10px;padding-top:10px}
#guide b{color:var(--gold2)}
#merit{right:24px;top:630px;width:290px;text-align:center}
#merit h3{margin:0 0 8px;font-family:var(--display);font-size:30px;color:var(--gold2);letter-spacing:.06em}
#merit ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:6px}
#merit li{display:flex;justify-content:space-between;gap:10px}
#merit li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#merit li span:last-child{color:var(--gold2);font-variant-numeric:tabular-nums}
#merit .empty{color:var(--muted);text-align:center}
/* chant banner + gift banner */
#chant{left:110px;right:110px;top:330px;padding:22px 30px;text-align:center;border-radius:24px;border:2px solid var(--gold);
  background:rgba(40,18,8,.86);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
#chant.show{opacity:1;transform:none}
#chant h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-size:30px;letter-spacing:.1em}
#chant p{margin:0;font-family:var(--display);font-style:italic;font-size:30px;line-height:1.45}
#gift{left:70px;right:70px;top:330px;z-index:5;padding:30px 40px;text-align:center;border-radius:28px;border:3px solid var(--gold2);
  background:radial-gradient(ellipse at 50% 0%,rgba(150,40,20,.95),rgba(50,14,6,.95));box-shadow:0 0 60px rgba(255,190,90,.45);
  opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#gift.show{opacity:1;transform:none}
#gift .who{font-family:var(--display);font-weight:700;font-size:52px;color:var(--gold2)}
#gift .what{font-size:36px;margin-top:6px}
#gift .pray{font-family:var(--display);font-style:italic;font-size:32px;color:var(--fg);margin-top:12px;opacity:.95}
/* enable sound (needed once: browsers block autoplay). Sits under the gift/chant banners (z 3-5) so it never hides them. */
#unmute{position:absolute;z-index:2;left:50%;top:430px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:var(--red);color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
@media (prefers-reduced-motion:reduce){#chant,#gift{transition:none}}
/* 9-slice frames from assets/ui (slice = frames.json, width = slice × display scale). Each rule only applies once
   that webp has loaded (html.f-<name>, set by the script), so a missing file keeps the plain look above.
   border-width reserves layout room; border-image-width can be larger and paints over the padding.
   The padding-box background in the frame's centre colour hides Chrome's 1px seams between stretched slices. */
.f-banner #gift,.f-banner #chant,.f-banner #plaque{background:rgb(147,29,16) padding-box;border-style:solid;border-color:transparent;border-radius:0;box-shadow:none;
  border-image:url(/assets/ui/banner.webp) 153 195 148 195 fill / 103px 131px 99px 131px stretch}
.f-banner #gift{border-width:34px 100px 30px;border-image-width:89px 113px 86px 113px;padding:2px 0;filter:drop-shadow(0 0 26px rgba(255,190,90,.45))}
.f-banner #gift .what{font-size:34px}
.f-banner #gift .pray{padding:0 14px}   /* wrapped prayer lines stay clear of the bottom corner ornaments */
.f-banner #chant{border-width:30px 96px 26px;border-image-width:89px 113px 86px 113px;padding:2px 0}
.f-banner #chant p{padding:0 14px}
.f-banner #gift::before,.f-banner #gift::after,.f-banner #plaque::before,.f-banner #plaque::after{content:"";position:absolute;left:50%;right:auto;transform:translateX(-50%);
  background:center/100% 100% no-repeat;pointer-events:none}
/* crests: crest_top 240×63 (row 31 on the top edge), crest_bottom 241×68 (row 44 on the bottom edge); positioned from the padding box */
.f-banner #gift::before{top:-52px;width:139px;height:37px;background-image:url(/assets/ui/banner_crest_top.webp)}
.f-banner #gift::after{top:auto;bottom:-44px;width:140px;height:39px;background-image:url(/assets/ui/banner_crest_bottom.webp)}
.f-banner #plaque{border-width:0 58px;border-image-width:62px 79px 60px 79px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
.f-banner #plaque::before{top:-13px;width:97px;height:26px;font-size:0;background-image:url(/assets/ui/banner_crest_top.webp)}
.f-banner #plaque::after{top:auto;bottom:-10px;width:98px;height:28px;font-size:0;background-image:url(/assets/ui/banner_crest_bottom.webp)}
.f-banner #title{font-size:56px;letter-spacing:.04em}
/* cards keep backdrop-filter: the card frame is a square-cornered rectangle, so the blurred box matches it */
.f-card .card{background:rgba(34,10,4,.6) padding-box;border-radius:0;border-style:solid;border-color:transparent;border-width:24px 22px;padding:0 8px;
  border-image:url(/assets/ui/card.webp) 157 167 158 167 fill / 47px 50px 47px 50px stretch}
.f-card #guide div+div{margin-top:7px;padding-top:7px}   /* the framed card is a little taller: keep it clear of the teachers' name tags */
.f-tag_s .pill{background:rgb(57,18,6) padding-box;border-style:solid;border-color:transparent;border-width:4px 6px;padding:8px 24px;
  border-image:url(/assets/ui/tag_s.webp) 43 45 41 45 fill / 32px 34px 31px 34px stretch}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><div id="title">Chánh Điện Tịnh Tâm</div><div id="subtitle">Nam Mô A Di Đà Phật</div></div>
  <div id="pills" class="ui">
    <div class="pill"><span class="dot"></span><span id="count">0/24</span><small>đang<br>thiền</small></div>
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
  </div>
  <div id="guide" class="card ui">
    <div>💬 <b>Bình luận bất kỳ</b> để vào thiền</div>
    <div>Gõ <b>nam · nữ · sư · ni · tiểu · bà · cao tăng</b> để đổi hình</div>
    <div>🎁 Tặng quà được <b>xướng tên hồi hướng</b></div>
  </div>
  <div id="merit" class="card ui"><h3>✦ Công Đức ✦</h3><ol id="meritList"><li class="empty">Chưa có</li></ol></div>
  <div id="chant" class="ui"><h4>✦ TỤNG KINH ĐỊNH KỲ ✦</h4><p id="chantText"></p></div>
  <div id="gift" class="ui"><div class="who" id="giftWho"></div><div class="what" id="giftWhat"></div><div class="pray" id="giftPray"></div></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
</div></div>

<script src="/assets/js/sprites.js?v=2"></script>
<script src="/assets/js/ui-frames.js?v=1"></script>
<script src="/assets/js/camera.js?v=1"></script>
<script>
/* ======================= stage fit ======================= */
const stage = document.getElementById('stage');
function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

/* ======================= assets ======================= */
const A = {};
const IMG = { hall:'/assets/hall.jpg', monk:'/assets/c_monk.png', nun:'/assets/c_nun.png', granny:'/assets/c_granny.png', man:'/assets/c_man.png',
  woman:'/assets/c_woman.png', child:'/assets/c_child.png',
  lotus:'/assets/fx_lotus.png', halo:'/assets/fx_halo.png', bell:'/assets/fx_bell.png', incense:'/assets/fx_incense.png', petal:'/assets/fx_petal.png' };
for (const [k,src] of Object.entries(IMG)){ const im=new Image(); im.src=src; A[k]=im; }
// sprite runtime (assets/js/sprites.js). If that script failed to load, a tiny stand-in seats everyone instantly with the static art.
const CDS = window.CDSprites || { loadSheets: async () => ({ get: () => null }), enqueue(){}, step(){}, waveDelay: () => 0,
  newActor: (x,y) => ({ x, y, state:'idle', action:'idle', frame:0, flip:false, queue:[] }),
  walk(a,pts,then){ const p=pts[pts.length-1]; a.x=p.x; a.y=p.y; a.state = then==='gone' ? 'gone' : 'idle'; }, leave(a){ a.state='gone'; } };
let SHEETS = { get: () => null }; CDS.loadSheets('/assets/sprites/', '2').then(s => SHEETS = s);
// 9-slice UI frames (assets/js/ui-frames.js). Missing script or image: FRAMES.get() → null and the plain rr() drawing stays.
const CDF = window.CDFrames || { load: async () => ({ get: () => null, names: () => [] }), nine: () => 0, scale: () => 0, part: () => false };
let FRAMES = { get: () => null };
CDF.load('/assets/ui/', '1').then(f => { FRAMES = f; for (const n of f.names()) document.documentElement.classList.add('f-'+n); });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// camera (assets/js/camera.js): world drawing goes through it, the DOM HUD stays fixed. Missing script: identity camera, shot() → false.
const CDC = window.CDCamera || { create: ({w,h}) => ({ x:w/2, y:h/2, zoom:1, bars:0, busy:false }), shot: () => false, release(){}, update(){},
  begin(){}, end(){}, worldToScreen: (c,x,y) => ({ x, y }) };
const camOff = new URLSearchParams(location.search).get('camera') === '0';
const camLive = !!window.CDCamera && !camOff && !reduce;   // no camera: no shots, so the chant wave keeps its old timing
const CAM = CDC.create({ w:1080, h:1920, ambient:true });
const clamp = (x,lo,hi) => Math.max(lo, Math.min(hi, x));
const avatars = new Map();
function avatar(url){ if(!url) return null; let im=avatars.get(url); if(!im){ im=new Image(); im.referrerPolicy='no-referrer'; im.src=url; avatars.set(url,im); } return im.naturalWidth?im:null; }

/* ======================= seats ======================= */
// Floor trapezoid in the painting: back row just below the altar, front row near the bottom.
const FLOOR = { yTop: 1215, yBot: 1845, halfTop: 290, halfBot: 430 };
const depth = y => (y-FLOOR.yTop)/(FLOOR.yBot-FLOOR.yTop);          // 0 = back row, 1 = front row
const speedAt = y => 170+190*clamp(depth(y),0,1.5);              // walk speed px/s, faster nearer the camera
const GRID = { 24:[6,4], 36:[6,6], 64:[8,8], 100:[10,10] };
let cap = 24, seats = [];
function layout(c){
  cap = c; const [cols, rows] = GRID[c] || GRID[24]; seats = [];
  for (let r=0;r<rows;r++){
    const t = rows===1 ? .5 : r/(rows-1);                     // 0 = back row
    const y = FLOOR.yTop + (FLOOR.yBot-FLOOR.yTop)*t;
    const half = FLOOR.halfTop + (FLOOR.halfBot-FLOOR.halfTop)*t;
    const scale = (.26 + .24*t) * (6/cols) ** .75;
    const gap = 2*half/(cols-1) * .93;                        // room for one name tag
    for (let k=0;k<cols;k++){
      let u = (k-(cols-1)/2)/((cols-1)/2); u = Math.sign(u)*(.14 + .86*Math.abs(u));   // open a centre aisle
      seats.push({ x: 540 + u*half, y, scale, r, k, rows, gap });
    }
  }
  // fill front rows first, aisle side first, so a small crowd still looks full on camera
  seats.sort((a,b)=> (b.r-a.r) || (Math.abs(a.x-540)-Math.abs(b.x-540)));
  // new grid size: keep everyone's relative order; seated people glide (render loop), walkers re-route
  [...visitors.values()].sort((a,b)=> (a.seatIdx<0)-(b.seatIdx<0) || a.seatIdx-b.seatIdx).forEach((v,i)=>{
    v.seatIdx = i<seats.length ? i : -1; v.seat = seats[v.seatIdx];
    if (v.seat && v.state==='walk') CDS.walk(v, seatPath(v, v.seat), 'sit');
  });
  for (const l of leaving) l.seatIdx = -1;   // their old index means nothing in the new grid
}
const visitors = new Map();  // id -> visitor (a CDSprites actor with page fields on top)
const leaving = [];           // people walking out: drawn, but not counted, not on the merit board
const HOLDS = new Set(['sit_down','idle','act','stand_up']);   // a leaver keeps its seat until it starts walking out
// aisle, then a point just below the seat: the last steps go straight up, so the walker is already walk_back when sit_down starts.
// The aisle point sits 60 px below the seat: at +25 the Catmull-Rom curve overshot up to ~17 px past the approach point on back rows.
const seatPath = (a, s) => a.y > s.y+75 ? [{x:540, y:s.y+60}, {x:s.x, y:s.y+14}, {x:s.x, y:s.y}]
  : a.y > s.y+20 ? [{x:s.x, y:s.y+14}, {x:s.x, y:s.y}] : [{x:s.x, y:s.y}];   // re-routed close to the seat (grid resize): still finish straight up
const isHeld = i => i>=0 && leaving.some(l => l.seatIdx===i && HOLDS.has(l.state));
// lowest seat nobody sits in; one still held by a leaver only if nothing else is free
function freeSeat(){
  const used = new Set([...visitors.values()].map(v => v.seatIdx));
  let heldIdx = -1;
  for (let i=0;i<seats.length;i++){ if (used.has(i)) continue; if (!isHeld(i)) return { idx:i, held:false }; if (heldIdx<0) heldIdx = i; }
  return { idx:heldIdx, held:heldIdx>=0 };
}
document.getElementById('count').textContent = '0/24';

/* the three fixed teachers in front of the altar */
const TEACHERS = [ { name:'Thầy Minh Đạo', skin:'monk', x:300, y:1085, s:.36 }, { name:'Sư Trụ Trì', skin:'monk', x:540, y:1100, s:.4, master:true }, { name:'Thầy Tâm Từ', skin:'monk', x:780, y:1085, s:.36 } ];

function addVisitor(p, instant){
  if (visitors.has(p.id)) { Object.assign(visitors.get(p.id), { name:p.name, skin:p.skin, avatar:p.avatar, coins:p.coins }); return; }
  const back = leaving.findIndex(l => l.id===p.id); if (back>=0) leaving.splice(back,1);   // came back while walking out
  const { idx, held } = freeSeat(), seat = seats[idx];
  if (held) instant = false;                       // the last one is still getting up there: wait off-stage, then walk in
  let a;
  if (!seat) a = CDS.newActor(540, 1500, true);
  else if (instant) a = CDS.newActor(seat.x, seat.y, true);
  else { a = CDS.newActor(540, 2020, false); CDS.walk(a, seatPath(a, seat), 'sit'); }
  const v = Object.assign(a, { id:p.id, name:p.name, skin:p.skin, avatar:p.avatar, coins:p.coins, demo:p.demo,
    seatIdx:idx, seat, fade: instant?1:0, bubble:null, glow:0, bow:0, phase:Math.random()*6.28 });
  visitors.set(p.id, v);
}
function removeVisitor(id){
  const v = visitors.get(id); if (!v) return;
  visitors.delete(id); v.out = true; leaving.push(v);
  const y = v.state==='walk' || !v.seat ? v.y : v.seat.y;   // still walking in: turn back at the current depth
  const lane = 540 + ((v.seat?.x ?? v.x) < 540 ? -1 : 1)*(10 + Math.random()*28);   // own lane on their side of the aisle, so neighbours fan out
  CDS.leave(v, [{x:lane, y:y+25}, {x:lane, y:2050}], Math.random()*1.5);   // staggered, so a full hall does not leave as one clump
}

/* ======================= HUD ======================= */
let startedAt = Date.now();
function updateCount(){ document.getElementById('count').textContent = `${visitors.size}/${cap}`; }
function renderMerit(){
  const top = [...visitors.values()].filter(v=>v.coins>0).sort((a,b)=>b.coins-a.coins).slice(0,5);
  const ol = document.getElementById('meritList'); ol.innerHTML='';
  if (!top.length){ ol.innerHTML='<li class="empty">Chưa có</li>'; return; }
  top.forEach((v,i)=>{ const li=document.createElement('li'); const a=document.createElement('span'); a.textContent=`${i+1}. ${v.name}`; const b=document.createElement('span'); b.textContent=v.coins; li.append(a,b); ol.append(li); });
}
setInterval(()=>{ const s=Math.floor((Date.now()-startedAt)/1000); document.getElementById('timer').textContent=[s/3600,s/60%60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':'); },1000);
let giftHide=null;
function showGift(m){
  document.getElementById('giftWho').textContent = m.name;
  document.getElementById('giftWhat').textContent = `thành tâm dâng ${m.giftName}${m.count>1?' ×'+m.count:''} · công đức ${m.total}`;
  document.getElementById('giftPray').textContent = '“' + m.prayer + '”';
  document.getElementById('chant').classList.remove('show');
  const el=document.getElementById('gift'); el.classList.add('show'); clearTimeout(giftHide); giftHide=setTimeout(()=>el.classList.remove('show'), m.tier>=3?9000:6500);
}
let chantHide=null;
function showChant(text){ document.getElementById('chantText').textContent=text; const el=document.getElementById('chant'); el.classList.add('show'); clearTimeout(chantHide); chantHide=setTimeout(()=>el.classList.remove('show'), 14000); }

/* ======================= audio ======================= */
let AC=null, master=null, musicGain=null, sfx=null, settings={ music:true, mo:true, moBpm:52 };
const TRACKS=['/assets/music/music1.mp3','/assets/music/music2.mp3']; let trackIdx=Math.floor(Math.random()*TRACKS.length), musicEl=null;
document.getElementById('unmute').onclick = e => { e.currentTarget.remove(); startAudio(); };
function startAudio(){
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value=settings.music?.5:0; musicGain.connect(master);
  sfx = AC.createGain(); sfx.gain.value=1; sfx.connect(master);
  nextTrack(); scheduleMo(); bell();
}
function nextTrack(){
  if (musicEl){ musicEl.pause(); }
  musicEl = new Audio(TRACKS[trackIdx++ % TRACKS.length]); const src=AC.createMediaElementSource(musicEl); src.connect(musicGain);
  musicEl.onended = nextTrack; musicEl.play().catch(()=>{});
}
function duck(on){ if(!musicGain) return; const t=AC.currentTime, target = !settings.music ? 0 : on ? .14 : .5; musicGain.gain.cancelScheduledValues(t); musicGain.gain.setValueAtTime(musicGain.gain.value,t); musicGain.gain.linearRampToValueAtTime(target,t+.5); }
let haloPulse=0;
function bell(big){
  if(!AC) return; const t=AC.currentTime, k=big?1.7:1;
  for (const [f,a,d] of [[216,.55,7],[432,.35,5],[1296,.12,3],[2160,.05,2]]) { const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*(big?.75:1); const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a*k*.7,t+.015); g.gain.exponentialRampToValueAtTime(.0005,t+d*k); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d*k+.1); }
  haloPulse=1;
}
function mo(){
  if(!AC) return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(620,t); o.frequency.exponentialRampToValueAtTime(380,t+.05);
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=3; const g=AC.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(bp); bp.connect(g); g.connect(sfx); o.start(t); o.stop(t+.16);
}
let moTimer=null; function scheduleMo(){ clearInterval(moTimer); if (AC && settings.mo) moTimer=setInterval(mo, 60000/Math.max(20,settings.moBpm||52)); }
// server-made voice lines play one after another
const ttsQ=[]; let ttsPlaying=false;
function queueTTS(url, onStart){ ttsQ.push({url,onStart}); playTTS(); }
function playTTS(){
  if (ttsPlaying || !ttsQ.length || !AC) return; ttsPlaying=true;
  const {url,onStart}=ttsQ.shift(); const el=new Audio(url); const src=AC.createMediaElementSource(el); const g=AC.createGain(); g.gain.value=1.25; src.connect(g); g.connect(master);
  el.onplay=()=>{ duck(true); onStart&&onStart(); }; el.onended=el.onerror=()=>{ duck(false); ttsPlaying=false; setTimeout(playTTS,350); };

const fx=[], petals=[];
function giftFx(v, tier){
  v.glow=1; v.bow=1;
  const kind = tier>=3?'bell':tier>=2?'lotus':'incense', s=v.seat?.scale||.4;
  fx.push({kind, x:v.x, y:v.y-220*s, t:0, life: tier>=3?3.4:2.4, scale: s*(tier>=3?1.5:1.1)});
  for (let i=0;i<(tier>=3?22:tier>=2?10:4);i++) petals.push({x:v.x+(Math.random()-.5)*120, y:v.y-80, vx:(Math.random()-.5)*40, vy:-(70+Math.random()*90), t:0, life:2.6+Math.random(), s:.16+Math.random()*.14});
  if (tier>=3){ bell(true); for (let i=0;i<30;i++) petals.push({x:540+(Math.random()-.5)*600, y:300+Math.random()*250, vx:(Math.random()-.5)*40, vy:30+Math.random()*50, t:0, life:5, s:.2+Math.random()*.15}); }
}
function hearts(v,n){ for (let i=0;i<Math.min(6,n);i++) petals.push({x:v.x+(Math.random()-.5)*60, y:v.y-140*(v.seat?.scale||.4), vx:(Math.random()-.5)*20, vy:-(50+Math.random()*40), t:0, life:1.6, s:.08, heart:true}); }

/* ======================= camera director ======================= */
const TAG_HOLD = 8000, TAG_FADE = 1500;   // ms a name tag stays up after activity in a big hall, and its fade-out
const lit = v => { if (v) v.tagUntil = performance.now() + TAG_HOLD; };
function giftShot(v, tier){
  if (!camLive || tier < 2) return;
  const p = v.state==='walk' && v.seat ? v.seat : v, s = v.seat?.scale || .4;   // still walking in: frame the seat they are heading to
  CDC.shot(CAM, tier >= 3 ? { x:p.x, y:p.y-120*s, zoom:1.6, hold:5, priority:3, bars:1 } : { x:p.x, y:p.y-120*s, zoom:1.3, hold:3, priority:2, bars:.5 });
}
function bowWave(){
  if (reduce) return;
  for (const v of visitors.values()) if (v.seat && (v.state==='idle'||v.state==='act')) CDS.enqueue(v,'bow',CDS.waveDelay(v.seat.rows-1-v.seat.r));   // front row first
}
// chant: close on the Buddha, then pull back over the hall and start the bow wave so it rolls front to back on camera
let waveTimer = null;
function chantShot(){
  clearTimeout(waveTimer);
  if (!camLive || !CDC.shot(CAM, { x:540, y:640, zoom:1.35, hold:2.2, priority:2, bars:.6 })) return bowWave();
  waveTimer = setTimeout(() => {
    const rows = (GRID[cap]||GRID[24])[1];
    CDC.shot(CAM, { x:540, y:1500, zoom:1.12, hold:rows*(CDS.WAVE_ROW_DELAY||.18)+2, priority:2, bars:.3 });
    bowWave();
  }, 2600);
}

/* ======================= server link ======================= */
let ws=null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='mất kết nối server… đang thử lại'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.t){
      case 'state':
        Object.assign(settings,m.settings); applySettings(); startedAt=m.startedAt;
        visitors.clear(); leaving.length=0; layout(m.cap); for (const p of m.viewers) addVisitor(p,true); updateCount(); renderMerit(); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); if (m.cap!==cap){ layout(m.cap); updateCount(); } break;
      case 'join': if (m.cap!==cap) layout(m.cap); addVisitor(m.v, m.v.demo && visitors.size>8); lit(visitors.get(m.v.id)); updateCount(); break;
      case 'leave': removeVisitor(m.id); updateCount(); renderMerit(); break;
      case 'skin': { const v=visitors.get(m.id); if(v){ v.skin=m.skin; v.glow=.8; } } break;
      case 'chat': { const v=visitors.get(m.id); if(v){ v.bubble={text:m.text, until:performance.now()+6000}; v.bow=.6; lit(v); CDS.enqueue(v,'bow'); } } break;
      case 'gift': { const v=visitors.get(m.id); if(v){ v.coins=m.total; giftFx(v,m.tier); lit(v); CDS.enqueue(v,'thank'); giftShot(v,m.tier); } renderMerit(); showGift(m); } break;
      case 'like': { const v=visitors.get(m.id); if(v){ hearts(v,m.n); lit(v); } } break;
      case 'tts': queueTTS(m.url); break;
      case 'chant': showChant(m.text); bell(); chantShot(); break;
      case 'bell': bell(true); break;
      case 'mo1': mo(); break;
    }
  };
}
function applySettings(){
  document.getElementById('title').textContent=settings.title||'Chánh Điện Tịnh Tâm';
  document.getElementById('subtitle').textContent=settings.subtitle||'Nam Mô A Di Đà Phật';
  duck(false); scheduleMo();
}

/* ======================= render ======================= */
const ctx=document.getElementById('c').getContext('2d');
function sprite(im,x,y,s,ay=1){ if(!im?.naturalWidth) return; const w=im.naturalWidth*s,h=im.naturalHeight*s; ctx.drawImage(im,x-w/2,y-h*ay,w,h); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// Framed tags are rendered once into a small offscreen canvas (frame + text) and blitted: at 100 people that is
// 1 drawImage per tag instead of 9 + fillText. Keyed by everything that changes the pixels; oldest entries drop first.
const tagCache = new Map(), TAG_CACHE_MAX = 400;
document.fonts?.addEventListener('loadingdone', () => tagCache.clear());   // tags drawn with a fallback font before the web font arrived
function tagSprite(fr, k, text, font, color, w, h, tx){
  const key = fr.name+'|'+font+'|'+color+'|'+Math.round(w)+'|'+tx.toFixed(1)+'|'+text;
  let c = tagCache.get(key);
  if (!c){
    c = document.createElement('canvas'); c.width = Math.ceil(w)+2; c.height = Math.ceil(h)+2;
    const g = c.getContext('2d'); CDF.nine(g, fr, 1, 1, w, h, k);
    g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 1+tx, 1+h/2+1);
    if (tagCache.size >= TAG_CACHE_MAX) tagCache.delete(tagCache.keys().next().value);
  } else tagCache.delete(key);
  tagCache.set(key, c);   // re-insert: most recently used last
  return c;
}
function tag(text,x,y,s,style,av,maxW){
  const fs=Math.max(15,Math.round(30*s/.4)); ctx.font=`600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  const h=fs*1.5, fr=FRAMES.get(style==='gold' && h>=32 ? 'tag' : 'tag_s'), k=fr ? CDF.scale(fr, 1e6, h) : 0;
  const pad = fr ? (fr.pad[1]+fr.pad[3])/2*k : fs*.5, avL = fr && fr.name==='tag' ? pad : pad*.55;   // ornate caps: avatar sits inside them
  let aw = av?fs*1.15:0;
  if (maxW){ if (aw && maxW < fs*5) aw=0, av=null; let t=text; while (t.length>2 && ctx.measureText(t).width+pad*2+aw > maxW) t=t.slice(0,-1); if (t!==text) text=t.trimEnd()+'…'; }
  const w=ctx.measureText(text).width+pad*2+aw, color = style==='gold'?'#ffd98a':'#f6e9cf';
  if (fr) ctx.drawImage(tagSprite(fr, k, text, ctx.font, color, w, h, w/2+aw/2), Math.round(x-w/2)-1, Math.round(y-h/2)-1);
  else {
    ctx.fillStyle = style==='gold'?'rgba(70,30,8,.92)':'rgba(18,9,5,.72)'; rr(x-w/2,y-h/2,w,h,h/2); ctx.fill();
    ctx.lineWidth = style==='gold'?3:1.5; ctx.strokeStyle = style==='gold'?'#e2b04f':'rgba(226,176,79,.55)'; ctx.stroke();
  }
  if (av){ ctx.save(); ctx.beginPath(); ctx.arc(x-w/2+avL+aw/2, y, fs*.5, 0, 6.29); ctx.clip(); ctx.drawImage(av, x-w/2+avL+aw/2-fs*.5, y-fs*.5, fs, fs); ctx.restore(); }
  if (!fr){ ctx.fillStyle = color; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, x+aw/2, y+1); }
}
function bubble(text,x,y,s){
  const fs=Math.max(18,Math.round(26*s/.4)); ctx.font=`500 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  let t=text; while (ctx.measureText(t).width>320 && t.length>4) t=t.slice(0,-2); if (t!==text) t=t.trimEnd()+'…';
  const w=ctx.measureText(t).width+fs*1.1, h=fs*1.6, fr=FRAMES.get('bubble'), k=CDF.nine(ctx, fr, x-w/2, y-h, w, h);
  if (k) CDF.part(ctx, fr, 'tail', x, y, k);
  else { ctx.fillStyle='rgba(255,247,230,.95)'; rr(x-w/2,y-h,w,h,fs*.5); ctx.fill(); ctx.beginPath(); ctx.moveTo(x-8,y); ctx.lineTo(x+8,y); ctx.lineTo(x,y+10); ctx.fill(); }
  ctx.fillStyle='#3a1a08'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y-h/2+1);
}
let last=performance.now();
function frame(now){

  ctx.save(); ctx.fillStyle='#efe3cc'; for (let i=0;i<16;i++){ const a=(t*.08+i*.0625)%1; ctx.globalAlpha=.28*(1-a); ctx.beginPath(); ctx.arc(540+Math.sin(a*7+i)*20*a, 1000-a*280, 4+a*15, 0, 6.28); ctx.fill(); } ctx.restore();
  // teachers
  for (const tc of TEACHERS){ if (tc.master){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.35+.1*Math.sin(t*1.5); sprite(A.halo,tc.x,tc.y-120,.9,.5); ctx.restore(); }
    sprite(A[tc.skin],tc.x,tc.y,tc.s); tag(tc.name,tc.x,tc.y-tc.s*260-22,tc.s,'gold'); }

  const walkK=(6/((GRID[cap]||GRID[24])[0]))**.7, scaleOf = v => v.state==='walk'||v.state==='exit' ? (.26+.26*clamp(depth(v.y),0,1))*walkK : v.seat?.scale||.4;
  for (const v of list){

    const sheet=SHEETS.get(v.skin);
    CDS.step(v, dt, sheet, speedAt, sheet ? scaleOf(v)*1.05*260/sheet.seatH : 1);
    if (v.state==='gone') continue;
    if (!v.out && v.seat && (v.state==='idle'||v.state==='act'||v.state==='sit_down')){ v.x+=(v.seat.x-v.x)*Math.min(1,dt*3); v.y+=(v.seat.y-v.y)*Math.min(1,dt*3); }   // glide when the grid grows

      const g=ctx.createRadialGradient(v.x,v.y-110*ws,8,v.x,v.y-110*ws,200*ws); g.addColorStop(0,'rgba(255,205,120,.95)'); g.addColorStop(1,'rgba(255,160,60,0)'); ctx.fillStyle=g; ctx.fillRect(v.x-230*ws,v.y-340*ws,460*ws,400*ws); ctx.restore(); }
    const seated = v.state==='idle'||v.state==='act';
    const breathe = v.state==='idle' && !reduce ? Math.sin(t*1.1+v.phase)*2*ws : 0, bowK = !sheet && seated ? Math.sin(Math.min(1,v.bow)*Math.PI)*.04 : 0;
    ctx.save(); ctx.globalAlpha=v.fade;
    let topY;
    if (sheet) topY = CDS.drawFrame(ctx, sheet, v.action, v.frame, v.x, v.y+breathe, ws*1.05*260/sheet.seatH, v.flip);
    else { ctx.translate(v.x,v.y); if (bowK) ctx.transform(1,0,0,1-bowK,0,0); const sk = v.skin==='master'?'monk':v.skin; sprite(A[sk]||A.man,0,breathe,ws*1.05); topY=260*ws; }
    ctx.restore();
    const ty=v.y-topY-14*ws/.4;
    // a big hall only shows the tags that matter right now: recent activity (fading out), big donors, the master, people walking in
    const tagA = cap<=36 || v.coins>=99 || v.skin==='master' || (v.state==='walk' && !v.out) ? 1 : clamp(((v.tagUntil||0)-now)/TAG_FADE, 0, 1);
    if (tagA>0){ ctx.globalAlpha=tagA; tag(v.name, v.x, ty, ws, v.skin==='master'||v.coins>=99?'gold':'', avatar(v.avatar), seated && !v.out ? v.seat?.gap : 0); ctx.globalAlpha=1; }
    if (v.bubble && now<v.bubble.until) bubbles.push([v.bubble.text, v.x, ty-Math.max(18,30*ws/.4), ws]); else v.bubble=null;
  }
  for (let i=leaving.length-1;i>=0;i--) if (leaving[i].state==='gone') leaving.splice(i,1);
  for (const b of bubbles) bubble(...b);
  // gift icons rising, petals / hearts
  for (let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.t+=dt; const k=f.t/f.life; if(k>=1){ fx.splice(i,1); continue; } const pop=1-Math.pow(1-Math.min(1,f.t*4),3);
    ctx.save(); ctx.globalAlpha=k<.75?1:(1-k)/.25; sprite(A[f.kind],f.x,f.y-k*170,f.scale*(.6+.4*pop)); ctx.restore(); }
  for (let i=petals.length-1;i>=0;i--){ const p=petals[i]; p.t+=dt; if(p.t>p.life){ petals.splice(i,1); continue; } p.x+=p.vx*dt+Math.sin(p.t*3+i)*20*dt; p.y+=p.vy*dt;
    ctx.save(); ctx.globalAlpha=Math.min(1,p.life-p.t); ctx.translate(p.x,p.y);
    if (p.heart){ ctx.fillStyle='#ff5a7a'; ctx.font='34px serif'; ctx.textAlign='center'; ctx.fillText('♥',0,0); } else { ctx.rotate(Math.sin(p.t*2+i)*.6); sprite(A.petal,0,0,p.s,.5); }
    ctx.restore(); }

}
